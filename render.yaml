# Render Blueprint — Evidence Package worker (spec §11a).
#
# A background worker (no HTTP port) that drains the package_generation queue
# using the native toolchain baked into Dockerfile.package-worker (LibreOffice,
# poppler, tesseract, python). The Vercel app keeps serving the UI/routes/approval;
# this worker does the heavy generation.
#
# Deploy: Render dashboard → New → Blueprint → point at this repo. Then set the
# secret env vars below (marked sync:false) under the service's Environment.

services:
  - type: worker
    name: pinnacle-package-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.package-worker
    # LibreOffice needs real memory; starter (512MB) is too small. standard = 2GB.
    plan: standard
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PACKAGE_EXTRACT_SCRIPT
        value: /app/scripts/extract.py
      - key: NODE_OPTIONS            # prefer IPv4 (Render has no IPv6 egress)
        value: --dns-result-order=ipv4first
      - key: PACKAGE_WORKER_INTERVAL_MS
        value: "30000"
      - key: FRONTEND_URL
        value: https://pinnaclecube.com
      # ── Secrets — set these in the Render dashboard (never commit them) ──
      - key: DATABASE_URL            # Supabase pooled connection string
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON  # full service-account JSON (one line)
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
